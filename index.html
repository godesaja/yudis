<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Interactive Photo App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            overflow: hidden;
            background: linear-gradient(135deg, #87CEEB 0%, #B0E0E6 50%, #E0F6FF 100%);
            height: 100vh;
            width: 100vw;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .photo-wrapper {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 80vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 20px;
        }

        /* Base photo style - tanpa background/border untuk PNG transparan */
        .photo-box {
            position: relative;
            width: 45%;
            aspect-ratio: 4 / 3;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* contain agar tidak terpotong, transparan terlihat */
            display: block;
            /* Hapus border-radius dan shadow agar PNG transparan terlihat bersih */
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.15)); /* Drop shadow untuk depth tanpa mengganggu transparansi */
        }

        /* Photo 2 - Left, hanya 10% lebih rendah dari foto 1 */
        .photo-2-container {
            z-index: 1;
            margin-bottom: 10%; /* Selisih 10% tinggi foto dari bawah */
        }

        /* Photo 1 - Right, lebih tinggi */
        .photo-1-container {
            z-index: 2;
            margin-bottom: 20%; /* 10% lebih tinggi dari foto 2 */
        }

        /* Animation: Squash & Stretch Vertical */
        @keyframes bounceSwap {
            0% { transform: scale(1, 1); }
            30% { transform: scale(0.9, 0.6); }
            50% { transform: scale(1.1, 0.9); }
            70% { transform: scale(0.95, 0.85); }
            100% { transform: scale(1, 1); }
        }

        .animating {
            animation: bounceSwap 0.5s ease-in-out;
        }

        /* Speech Bubble */
        .speech-bubble {
            position: absolute;
            top: -80px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 15px 25px;
            border-radius: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            min-width: 150px;
            text-align: center;
            z-index: 10;
            transform-origin: center bottom;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 20px solid white;
        }

        .bubble-text {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            min-height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.8);
            font-size: 14px;
            text-align: center;
            pointer-events: none;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* Error state untuk gambar tidak ditemukan */
        .img-error {
            background: linear-gradient(45deg, #ff6b6b 25%, #ee5a6f 25%, #ee5a6f 50%, #ff6b6b 50%, #ff6b6b 75%, #ee5a6f 75%) !important;
            background-size: 20px 20px !important;
            display: flex !important;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: bold;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
        }

        @media (max-height: 700px) {
            .speech-bubble { top: -70px; padding: 12px 20px; }
        }

        @media (max-width: 350px) {
            .photo-wrapper { gap: 15px; }
            .photo-box { width: 48%; }
            .speech-bubble { min-width: 120px; padding: 10px 15px; }
            .bubble-text { font-size: 14px; }
        }
    </style>
</head>
<body>

<div class="container" id="tapArea">
    <div class="photo-wrapper">
        
        <!-- Photo 2 (Left, 10% lebih rendah) -->
        <div class="photo-box photo-2-container">
            <img src="./foto_2.png" alt="Foto 2" id="photo2">
        </div>

        <!-- Photo 1 (Right, lebih tinggi) dengan Speech Bubble -->
        <div class="photo-box photo-1-container" id="photo1Container">
            <!-- Speech Bubble -->
            <div class="speech-bubble" id="speechBubble">
                <div class="bubble-text" id="bubbleText">Halo! 👋</div>
            </div>
            
            <img src="./foto_1a.png" alt="Foto 1a" id="photo1">
        </div>

    </div>

    <div class="hint">Ketuk layar untuk berinteraksi</div>
</div>

<script>
    let isPhoto1A = true;
    let textIndex = 0;
    const texts = ["Halo! 👋", "Gimana kabarmu? 😊", "Lagi ngapain nih? 🤔", "Keren banget! 🔥"];

    const photo1 = document.getElementById('photo1');
    const photo2 = document.getElementById('photo2');
    const speechBubble = document.getElementById('speechBubble');
    const bubbleText = document.getElementById('bubbleText');
    const tapArea = document.getElementById('tapArea');

    // Handle image errors
    function handleImageError(img, namaFile) {
        console.error('ERROR: ' + namaFile + ' tidak ditemukan!');
        img.classList.add('img-error');
        img.style.objectFit = 'contain';
        img.src = 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="75"><rect fill="%23ff6b6b" width="100" height="75"/><text fill="white" x="50" y="40" text-anchor="middle" font-size="10">ERROR:'+namaFile+'</text></svg>';
    }

    photo1.onerror = function() { handleImageError(this, 'foto_1a.png'); };
    photo2.onerror = function() { handleImageError(this, 'foto_2.png'); };

    function animateElement(element) {
        element.classList.remove('animating');
        void element.offsetWidth;
        element.classList.add('animating');
        setTimeout(() => element.classList.remove('animating'), 500);
    }

    function handleTap(e) {
        e.preventDefault();
        isPhoto1A = !isPhoto1A;
        animateElement(photo1);
        
        setTimeout(() => {
            const newSrc = isPhoto1A ? './foto_1a.png' : './foto_1b.png';
            photo1.src = newSrc;
            photo1.onerror = function() { handleImageError(this, isPhoto1A ? 'foto_1a.png' : 'foto_1b.png'); };
        }, 150);
        
        animateElement(speechBubble);
        textIndex = (textIndex + 1) % texts.length;
        setTimeout(() => { bubbleText.textContent = texts[textIndex]; }, 150);
    }

    tapArea.addEventListener('click', handleTap);
    tapArea.addEventListener('touchstart', function(e) { e.preventDefault(); handleTap(e); }, {passive: false});

    let lastTouchEnd = 0;
    document.addEventListener('touchend', function(e) {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) e.preventDefault();
        lastTouchEnd = now;
    }, false);

    document.addEventListener('touchmove', function(e) { e.preventDefault(); }, {passive: false});
</script>

</body>
</html>
