<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Interactive Photo App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            overflow: hidden;
            background: linear-gradient(135deg, #87CEEB 0%, #B0E0E6 50%, #E0F6FF 100%);
            height: 100vh;
            width: 100vw;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .photo-wrapper {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 80vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 20px;
        }

        /* Photo 2 - Left, Lower position */
        .photo-2-container {
            position: relative;
            width: 45%;
            height: 55%;
            align-self: flex-end;
            margin-bottom: 10%;
            z-index: 1;
        }

        .photo-2 {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            background: #fff;
            display: block;
        }

        /* Photo 1 - Right, Higher position */
        .photo-1-container {
            position: relative;
            width: 45%;
            height: 65%;
            align-self: flex-start;
            margin-top: 5%;
            z-index: 2;
        }

        .photo-1 {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
            background: #fff;
            display: block;
            transform-origin: center bottom;
        }

        /* Animation: Squash & Stretch Vertical */
        @keyframes bounceSwap {
            0% {
                transform: scale(1, 1);
            }
            30% {
                transform: scale(0.9, 0.6); /* Vertical squash more than horizontal */
            }
            50% {
                transform: scale(1.1, 0.9); /* Stretch back */
            }
            70% {
                transform: scale(0.95, 0.85); /* Small bounce */
            }
            100% {
                transform: scale(1, 1);
            }
        }

        .animating {
            animation: bounceSwap 0.5s ease-in-out;
        }

        /* Speech Bubble */
        .speech-bubble {
            position: absolute;
            top: -80px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 15px 25px;
            border-radius: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            min-width: 150px;
            text-align: center;
            z-index: 10;
            transform-origin: center bottom;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 20px solid white;
        }

        .bubble-text {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            min-height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Hint text */
        .hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.8);
            font-size: 14px;
            text-align: center;
            pointer-events: none;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* Placeholder styling for empty images */
        .placeholder-img {
            background: linear-gradient(45deg, #f0f0f0 25%, #e0e0e0 25%, #e0e0e0 50%, #f0f0f0 50%, #f0f0f0 75%, #e0e0e0 75%);
            background-size: 20px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 14px;
            text-align: center;
        }

        /* Responsive adjustments */
        @media (max-height: 700px) {
            .photo-1-container { height: 60%; }
            .photo-2-container { height: 50%; }
            .speech-bubble { top: -70px; padding: 12px 20px; }
        }

        @media (max-width: 350px) {
            .photo-wrapper { gap: 15px; }
            .speech-bubble { min-width: 120px; padding: 10px 15px; }
            .bubble-text { font-size: 14px; }
        }
    </style>
</head>
<body>

<div class="container" id="tapArea">
    <div class="photo-wrapper">
        
        <!-- Photo 2 (Left, Lower) -->
        <div class="photo-2-container">
            <img src="foto2.png" alt="Foto 2" class="photo-2 placeholder-img" id="photo2" onerror="this.style.background='linear-gradient(135deg, #667eea 0%, #764ba2 100%)'; this.style.display='flex'; this.innerHTML='Foto 2';">
        </div>

        <!-- Photo 1 (Right, Higher) with Speech Bubble -->
        <div class="photo-1-container" id="photo1Container">
            <!-- Speech Bubble -->
            <div class="speech-bubble" id="speechBubble">
                <div class="bubble-text" id="bubbleText">Halo! 👋</div>
            </div>
            
            <!-- Photo 1 -->
            <img src="foto1a.png" alt="Foto 1" class="photo-1 placeholder-img" id="photo1" onerror="this.style.background='linear-gradient(135deg, #f093fb 0%, #f5576c 100%)'; this.style.display='flex'; this.innerHTML='Foto 1a';">
        </div>

    </div>

    <div class="hint">Ketuk layar untuk berinteraksi</div>
</div>

<script>
    // State management
    let isPhoto1A = true;
    let textIndex = 0;
    const texts = [
        "Halo! 👋",
        "Gimana kabarmu? 😊", 
        "Lagi ngapain nih? 🤔",
        "Keren banget! 🔥"
    ];

    const photo1 = document.getElementById('photo1');
    const photo1Container = document.getElementById('photo1Container');
    const speechBubble = document.getElementById('speechBubble');
    const bubbleText = document.getElementById('bubbleText');
    const tapArea = document.getElementById('tapArea');

    // Animation function with squash & stretch
    function animateElement(element) {
        // Remove existing animation class
        element.classList.remove('animating');
        
        // Force reflow to restart animation
        void element.offsetWidth;
        
        // Add animation class
        element.classList.add('animating');
        
        // Remove class after animation completes
        setTimeout(() => {
            element.classList.remove('animating');
        }, 500);
    }

    // Handle tap interaction
    function handleTap(e) {
        // Prevent double firing on some devices
        e.preventDefault();
        
        // Toggle Photo 1 (1a ↔ 1b)
        isPhoto1A = !isPhoto1A;
        
        // Animate photo with squash & stretch
        animateElement(photo1);
        
        // Change photo source after a brief delay for visual effect
        setTimeout(() => {
            if (isPhoto1A) {
                photo1.src = "foto1a.png";
                // Fallback if image fails to load
                photo1.onerror = function() {
                    this.style.background = 'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)';
                    this.style.display = 'flex';
                    this.innerHTML = 'Foto 1a';
                };
            } else {
                photo1.src = "foto1b.png";
                photo1.onerror = function() {
                    this.style.background = 'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)';
                    this.style.display = 'flex';
                    this.innerHTML = 'Foto 1b';
                };
            }
        }, 150); // Change at peak of squash for best effect
        
        // Animate speech bubble with same animation
        animateElement(speechBubble);
        
        // Cycle text (1→2→3→4→1...)
        textIndex = (textIndex + 1) % texts.length;
        
        // Change text with slight delay to match photo timing
        setTimeout(() => {
            bubbleText.textContent = texts[textIndex];
        }, 150);
    }

    // Event listeners for mobile and desktop
    tapArea.addEventListener('click', handleTap);
    tapArea.addEventListener('touchstart', function(e) {
        e.preventDefault(); // Prevent mouse emulation
        handleTap(e);
    }, {passive: false});

    // Prevent zoom on double tap
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function(e) {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
            e.preventDefault();
        }
        lastTouchEnd = now;
    }, false);

    // Prevent default touch behaviors that might interfere
    document.addEventListener('touchmove', function(e) {
        e.preventDefault();
    }, {passive: false});
</script>

</body>
</html>
