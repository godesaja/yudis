<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Interactive Photo App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            overflow: hidden;
            background: linear-gradient(135deg, #87CEEB 0%, #B0E0E6 50%, #E0F6FF 100%);
            height: 100vh;
            width: 100vw;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .photo-wrapper {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 80vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 20px;
        }

        .photo-2-container {
            position: relative;
            width: 45%;
            height: 55%;
            align-self: flex-end;
            margin-bottom: 10%;
            z-index: 1;
        }

        .photo-2 {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: block;
        }

        .photo-1-container {
            position: relative;
            width: 45%;
            height: 65%;
            align-self: flex-start;
            margin-top: 5%;
            z-index: 2;
        }

        .photo-1 {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
            display: block;
            transform-origin: center bottom;
        }

        /* Placeholder saat gambar error */
        .img-error {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%) !important;
            display: flex !important;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            padding: 10px;
        }

        @keyframes bounceSwap {
            0% { transform: scale(1, 1); }
            30% { transform: scale(0.9, 0.6); }
            50% { transform: scale(1.1, 0.9); }
            70% { transform: scale(0.95, 0.85); }
            100% { transform: scale(1, 1); }
        }

        .animating {
            animation: bounceSwap 0.5s ease-in-out;
        }

        .speech-bubble {
            position: absolute;
            top: -80px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 15px 25px;
            border-radius: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            min-width: 150px;
            text-align: center;
            z-index: 10;
            transform-origin: center bottom;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 20px solid white;
        }

        .bubble-text {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            min-height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.8);
            font-size: 14px;
            text-align: center;
            pointer-events: none;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* Debug info */
        .debug-info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: #0f0;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            font-family: monospace;
            z-index: 100;
            max-width: 90%;
            display: none;
        }

        @media (max-height: 700px) {
            .photo-1-container { height: 60%; }
            .photo-2-container { height: 50%; }
            .speech-bubble { top: -70px; padding: 12px 20px; }
        }

        @media (max-width: 350px) {
            .photo-wrapper { gap: 15px; }
            .speech-bubble { min-width: 120px; padding: 10px 15px; }
            .bubble-text { font-size: 14px; }
        }
    </style>
</head>
<body>

<div class="container" id="tapArea">
    <!-- Debug panel - tekan lama untuk muncul -->
    <div class="debug-info" id="debugPanel"></div>

    <div class="photo-wrapper">
        
        <!-- Photo 2 (Left, Lower) -->
        <div class="photo-2-container">
            <img src="./foto_2.png" alt="Foto 2" class="photo-2" id="photo2">
        </div>

        <!-- Photo 1 (Right, Higher) with Speech Bubble -->
        <div class="photo-1-container" id="photo1Container">
            <div class="speech-bubble" id="speechBubble">
                <div class="bubble-text" id="bubbleText">Halo! 👋</div>
            </div>
            
            <img src="./foto_1a.png" alt="Foto 1a" class="photo-1" id="photo1">
        </div>

    </div>

    <div class="hint">Ketuk layar untuk berinteraksi</div>
</div>

<script>
    // Debug panel
    const debugPanel = document.getElementById('debugPanel');
    let debugMode = false;

    function log(msg) {
        console.log(msg);
        if (debugMode) {
            debugPanel.innerHTML += msg + '<br>';
            debugPanel.style.display = 'block';
        }
    }

    // Toggle debug dengan tekan lama
    let pressTimer;
    const tapArea = document.getElementById('tapArea');
    
    tapArea.addEventListener('touchstart', function(e) {
        if (e.touches.length > 1) {
            debugMode = !debugMode;
            debugPanel.style.display = debugMode ? 'block' : 'none';
            if (debugMode) log('DEBUG MODE ON');
        }
    });

    let isPhoto1A = true;
    let textIndex = 0;
    const texts = ["Halo! 👋", "Gimana kabarmu? 😊", "Lagi ngapain nih? 🤔", "Keren banget! 🔥"];

    const photo1 = document.getElementById('photo1');
    const photo2 = document.getElementById('photo2');
    const speechBubble = document.getElementById('speechBubble');
    const bubbleText = document.getElementById('bubbleText');

    // Handle image errors dengan jelas
    function handleImageError(img, namaFile) {
        log('ERROR: ' + namaFile + ' tidak ditemukan!');
        img.classList.add('img-error');
        img.alt = 'ERROR: ' + namaFile + '\nTidak ditemukan';
    }

    photo1.onerror = function() { handleImageError(this, 'foto_1a.png'); };
    photo2.onerror = function() { handleImageError(this, 'foto_2.png'); };

    // Cek apakah gambar sudah load
    photo1.onload = function() { log('OK: foto_1a.png loaded'); };
    photo2.onload = function() { log('OK: foto_2.png loaded'); };

    function animateElement(element) {
        element.classList.remove('animating');
        void element.offsetWidth;
        element.classList.add('animating');
        setTimeout(() => element.classList.remove('animating'), 500);
    }

    function handleTap(e) {
        e.preventDefault();
        isPhoto1A = !isPhoto1A;
        animateElement(photo1);
        
        setTimeout(() => {
            const newSrc = isPhoto1A ? './foto_1a.png' : './foto_1b.png';
            log('Switching to: ' + newSrc);
            photo1.src = newSrc;
            photo1.onerror = function() { 
                handleImageError(this, isPhoto1A ? 'foto_1a.png' : 'foto_1b.png'); 
            };
        }, 150);
        
        animateElement(speechBubble);
        textIndex = (textIndex + 1) % texts.length;
        setTimeout(() => { bubbleText.textContent = texts[textIndex]; }, 150);
    }

    tapArea.addEventListener('click', handleTap);
    tapArea.addEventListener('touchstart', function(e) { e.preventDefault(); handleTap(e); }, {passive: false});

    let lastTouchEnd = 0;
    document.addEventListener('touchend', function(e) {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) e.preventDefault();
        lastTouchEnd = now;
    }, false);

    document.addEventListener('touchmove', function(e) { e.preventDefault(); }, {passive: false});

    // Log initial state
    log('Current path: ' + window.location.href);
    log('Checking images...');
</script>

</body>
</html>
