<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Interactive Photo App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            touch-action: none;
            -webkit-overflow-scrolling: none;
            overscroll-behavior: none;
        }

        body {
            background: url('./foto_bg.jpg') no-repeat center top;
            background-size: 100% auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #tapArea {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Container foto — layering */
        .scene {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Foto 2 — di belakang, z-index 1 */
        #photo2 {
            position: absolute;
            z-index: 1;
            width: 100%;
            height: auto;
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 3 / 4;
            object-fit: contain;
            /* Border biru muda neon */
            border: 4px solid #00FFFF;
            /* Bayangan multi-layer untuk efek neon */
            box-shadow: 
                0 0 10px #00FFFF,
                0 0 20px #00FFFF,
                0 0 40px #00FFFF,
                0 0 80px rgba(0, 255, 255, 0.3),
                0 20px 60px rgba(0, 0, 0, 0.4);
            /* Efek glow pada border */
            outline: 2px solid rgba(0, 255, 255, 0.5);
            outline-offset: 4px;
            /* Border radius halus */
            border-radius: 12px;
            /* Background untuk area transparan */
            background: linear-gradient(145deg, #E0F7FA 0%, #B2EBF2 50%, #80DEEA 100%);
            /* Filter untuk efek visual tambahan */
            filter: brightness(1.05) contrast(1.02);
            /* Transition untuk efek hover */
            transition: all 0.3s ease;
        }

        /* Efek hover/tap pada foto 2 */
        #photo2:hover {
            box-shadow: 
                0 0 15px #00FFFF,
                0 0 30px #00FFFF,
                0 0 60px #00FFFF,
                0 0 100px rgba(0, 255, 255, 0.5),
                0 25px 70px rgba(0, 0, 0, 0.5);
            transform: scale(1.02);
        }

        /* Foto 1 — di depan, z-index 2 */
        #photo1Container {
            position: absolute;
            z-index: 2;
            width: 100%;
            height: auto;
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 3 / 4;
        }

        #photo1 {
            width: 100%;
            height: 100%;
            aspect-ratio: 3 / 4;
            object-fit: contain;
            /* MURNI — tanpa efek apapun */
            border: none;
            outline: none;
            box-shadow: none;
            background: none;
            filter: none;
            border-radius: 0;
            display: block;
        }

        /* Speech Bubble */
        .speech-bubble {
            position: absolute;
            top: 100px;
            left: 70%;
            transform: translateX(-50%);
            background: white;
            padding: 12px 20px;
            border-radius: 20px;
            white-space: nowrap;
            z-index: 10;
        }

        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 15px solid white;
        }

        .bubble-text {
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }

        /* Hint */
        .hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.7);
            font-size: 12px;
            pointer-events: none;
            z-index: 5;
        }

        /* Error — hanya untuk debug, hapus jika tidak perlu */
        .img-error {
            background: rgba(255,0,0,0.1) !important;
            min-width: 100px;
            min-height: 75px;
        }
    </style>

</head>
<body>

<div id="tapArea">
    <div class="scene">
        <!-- Foto 2 — di belakang, z-index 1 -->
        <img src="./foto_2.png" alt="" id="photo2">

        <!-- Foto 1 — di depan, z-index 2 -->
        <div id="photo1Container">
            <div class="speech-bubble" id="speechBubble">
                <div class="bubble-text" id="bubbleText">Halo!</div>
            </div>
            <img src="./foto_1a.png" alt="" id="photo1">
        </div>
    </div>
    <div class="hint">Ketuk layar</div>
</div>

<script>
    // Lock scroll & zoom
    document.addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
    document.addEventListener('gesturechange', function(e) { e.preventDefault(); });
    document.addEventListener('gestureend', function(e) { e.preventDefault(); });
    window.addEventListener('wheel', function(e) { e.preventDefault(); }, { passive: false });

    let isPhoto1A = true;
    let textIndex = 0;
    const texts = ["Halo!", "Gimana?", "Lagi apa?", "Keren!"];

    const photo1 = document.getElementById('photo1');
    const speechBubble = document.getElementById('speechBubble');
    const bubbleText = document.getElementById('bubbleText');
    const tapArea = document.getElementById('tapArea');

    // Error handler minimal
    photo1.onerror = function() {
        this.classList.add('img-error');
        this.alt = 'foto_1a.png tidak ditemukan';
    };
    document.getElementById('photo2').onerror = function() {
        this.classList.add('img-error');
        this.alt = 'foto_2.png tidak ditemukan';
    };

    function animate(el) {
        el.style.animation = 'none';
        el.offsetHeight;
        el.style.animation = 'bounceSwap 0.5s ease-in-out';
        setTimeout(() => { el.style.animation = ''; }, 500);
    }

    // Inject animasi via JS agar tidak conflict
    const style = document.createElement('style');
    style.textContent = `
        @keyframes bounceSwap {
            0% { transform: scale(1, 1); }
            30% { transform: scale(0.85, 0.55); }
            50% { transform: scale(1.15, 0.9); }
            70% { transform: scale(0.92, 0.82); }
            100% { transform: scale(1, 1); }
        }
    `;
    document.head.appendChild(style);

    function handleTap(e) {
        e.preventDefault();
        isPhoto1A = !isPhoto1A;
        animate(photo1);
        setTimeout(() => {
            photo1.src = isPhoto1A ? './foto_1a.png' : './foto_1b.png';
        }, 150);
        animate(speechBubble);
        textIndex = (textIndex + 1) % texts.length;
        setTimeout(() => { bubbleText.textContent = texts[textIndex]; }, 150);
    }

    tapArea.addEventListener('click', handleTap);
    tapArea.addEventListener('touchstart', function(e) { e.preventDefault(); handleTap(e); }, { passive: false });
</script>

</body>
</html>
